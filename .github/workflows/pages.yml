name: Build and deploy

on:
  push:
    branches: [main]
    tags: ["data-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SQLite from CSV
        run: python3 scripts/build_sqlite.py
      - name: Export JSON API
        run: python3 scripts/export_api.py
      - name: Tests
        run: python3 -m unittest discover tests
      - name: Compress database
        run: |
          v=$(python3 -c "import json;print(json.load(open('site/api/v1/index.json'))['data_version'])")
          gzip -9 -c build/pokedata.sqlite > "build/pokedata-$v.sqlite.gz"
          echo "DATA_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite
          path: build/pokedata-*.sqlite.gz

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/data-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sqlite
      - name: Publish release with the SQLite database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pokedata-*.sqlite.gz \
            --repo "$GITHUB_REPOSITORY" --title "Données $GITHUB_REF_NAME" \
            --notes "Base SQLite de pokedata ($GITHUB_REF_NAME). Projet de fans non officiel ; données © Nintendo / Creatures / GAME FREAK / The Pokémon Company."
